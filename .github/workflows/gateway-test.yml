name: Raise gateway tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-test.yml"

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
