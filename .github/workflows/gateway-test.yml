name: Raise gateway tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-test.yml"
      - ".github/workflows/gateway-deploy.yml"

permissions:
  contents: read

concurrency:
  group: raise-gateway-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: "22.23.3"
          package-manager-cache: false
      - name: Verify Node runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.3"
          test "$(npm --version)" = "10.9.9"
      - name: Gateway unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test
      - name: Deployment script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/install-user-gateway.sh
          bash -n deploy/assert-idempotent-redeploy.sh
          mapfile -d '' node_files < <(find deploy src -type f -name '*.mjs' -print0 | sort -z)
          test "${#node_files[@]}" -gt 0
          for path in "${node_files[@]}"; do
            node --check "$path"
          done

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- .
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code -- .
          test -z "$(git -C "$GITHUB_WORKSPACE" ls-files --others --exclude-standard)"
