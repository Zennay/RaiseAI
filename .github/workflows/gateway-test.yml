name: Raise gateway tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-test.yml"
      - ".github/workflows/gateway-deploy.yml"

permissions:
  contents: read

concurrency:
  group: raise-gateway-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Gateway unit tests
        shell: bash
        run: |
          set -euo pipefail
          npm test
      - name: Deployment script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/install-user-gateway.sh
          bash -n deploy/assert-idempotent-redeploy.sh
          node --check deploy/readiness-policy.mjs
          node --check deploy/wait-for-live.mjs
          node --check deploy/smoke-live.mjs
          node --check deploy/attest-payload.mjs
          node --check deploy/attest-runtime-wiring.mjs
          node --check deploy/attest-watch-profile.mjs
          node --check deploy/write-deploy-evidence.mjs
          node --check deploy/validate-deploy-evidence.mjs
          node --check src/server.mjs
