name: Raise gateway tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-test.yml"
      - ".github/workflows/gateway-deploy.yml"

permissions:
  contents: read

concurrency:
  group: raise-gateway-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact tested revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Gateway unit tests
        run: npm test
      - name: Deployment script syntax
        run: |
          bash -n deploy/install-user-gateway.sh
          bash -n deploy/assert-idempotent-redeploy.sh
          node --check deploy/readiness-policy.mjs
          node --check deploy/wait-for-live.mjs
          node --check deploy/smoke-live.mjs
          node --check deploy/attest-payload.mjs
          node --check deploy/attest-runtime-wiring.mjs
          node --check deploy/attest-watch-profile.mjs
          node --check deploy/write-deploy-evidence.mjs
          node --check deploy/validate-deploy-evidence.mjs
          node --check src/server.mjs
