name: Android Studio launcher quality CI

on:
  push:
    branches:
      - main
    paths:
      - "open-in-android-studio.command"
      - "tests/test_android_studio_launcher.py"
      - ".github/workflows/android-studio-launcher-quality.yml"
  pull_request:
    paths:
      - "open-in-android-studio.command"
      - "tests/test_android_studio_launcher.py"
      - ".github/workflows/android-studio-launcher-quality.yml"

permissions:
  contents: read

concurrency:
  group: android-studio-launcher-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Validate launcher
        shell: bash
        run: |
          set -euo pipefail
          bash -n open-in-android-studio.command
          python3 -m unittest discover -s tests -p 'test_android_studio_launcher.py' -v
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
