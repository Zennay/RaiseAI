name: Gradle bootstrap integrity CI

on:
  push:
    branches:
      - main
    paths:
      - "gradlew"
      - "tests/test_gradle_bootstrap_integrity.py"
      - "tests/test_gradle_ci_runtime_contract.py"
      - ".github/workflows/gradle-bootstrap-integrity.yml"
  pull_request:
    paths:
      - "gradlew"
      - "tests/test_gradle_bootstrap_integrity.py"
      - "tests/test_gradle_ci_runtime_contract.py"
      - ".github/workflows/gradle-bootstrap-integrity.yml"

permissions:
  contents: read

concurrency:
  group: raise-gradle-bootstrap-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Pin exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Bootstrap syntax and integrity regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n gradlew
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m unittest tests.test_gradle_bootstrap_integrity tests.test_gradle_ci_runtime_contract

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
