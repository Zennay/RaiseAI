name: Gateway self-hosted quality CI

on:
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-test.yml"
      - ".github/workflows/gateway-quality-selfhosted.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: raise-gateway-selfhosted-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway-quality:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 10
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up audited Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Verify Node runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p \"process.versions.node.split('.')[0]\")" = "22"

      - name: Run gateway regressions directly
        shell: bash
        run: |
          set -euo pipefail
          node --test

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- .
          git -C "$GITHUB_WORKSPACE" diff --cached --exit-code -- .
          test -z "$(git -C "$GITHUB_WORKSPACE" ls-files --others --exclude-standard)"
