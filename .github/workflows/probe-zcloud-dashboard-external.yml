name: External zCloud dashboard probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-zcloud-dashboard-external.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public zCloud dashboard
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ROOT ==="
          curl -fsS --connect-timeout 5 --max-time 15 -o /tmp/root.html -w 'ROOT_HTTP=%{http_code} bytes=%{size_download}\n' http://198.244.191.182:8765/
          grep -q 'zCloud' /tmp/root.html
          echo "=== STATUS ==="
          ok=0
          for attempt in 1 2; do
            code="$(curl -sS --connect-timeout 5 --max-time 30 -o /tmp/status.json -w '%{http_code}' http://198.244.191.182:8765/api/status || true)"
            echo "attempt=$attempt STATUS_HTTP=$code bytes=$(wc -c </tmp/status.json 2>/dev/null || echo 0)"
            if [[ "$code" == "200" ]]; then
              python3 - <<'PY'
          import json
          p=json.load(open('/tmp/status.json'))
          print({'errors':p.get('errors'),'healthy':(p.get('health') or {}).get('healthy'),'time':p.get('time')})
          PY
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" -eq 1
          echo ZCLOUD_EXTERNAL_DASHBOARD_GREEN
