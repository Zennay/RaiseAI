name: Raise gateway deploy + live smoke

on:
  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: raise-gateway-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: [self-hosted, vps-bb300bba]
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Baseline health (pre-deploy, best-effort)
        id: baseline
        continue-on-error: true
        run: |
          source "$HOME/.config/raiseai/gateway.env" 2>/dev/null || true
          curl --fail --silent --show-error --max-time 5 \
            --cacert "${RAISE_TLS_CERT:-/dev/null}" \
            "https://$(hostname -f):${RAISE_PORT:-8787}/health" || echo "baseline unreachable (expected on first install)"

      - name: Install / restart gateway (idempotent)
        id: deploy
        env:
          RAISE_DEPLOY_REVISION: ${{ github.sha }}
          RAISE_READY_REPORT: ${{ runner.temp }}/raise-ready-initial.json
        run: bash deploy/install-user-gateway.sh

      - name: Attest installed gateway payload
        id: payload_initial
        env:
          RAISE_PAYLOAD_REPORT: ${{ runner.temp }}/raise-payload-initial.json
        run: node deploy/attest-payload.mjs

      - name: Live smoke verification (exact revision, no side effects)
        id: smoke_initial
        env:
          RAISE_EXPECTED_REVISION: ${{ github.sha }}
          RAISE_SMOKE_REPORT: ${{ runner.temp }}/raise-smoke-initial.json
        run: node deploy/smoke-live.mjs

      - name: Prove repeat deploy is idempotent
        id: idempotency
        env:
          RAISE_DEPLOY_REVISION: ${{ github.sha }}
          RAISE_READY_REPORT: ${{ runner.temp }}/raise-ready-repeat.json
        run: bash deploy/assert-idempotent-redeploy.sh

      - name: Attest payload after repeat deploy
        id: payload_repeat
        env:
          RAISE_PAYLOAD_REPORT: ${{ runner.temp }}/raise-payload-repeat.json
        run: node deploy/attest-payload.mjs

      - name: Live smoke after repeat deploy
        id: smoke_repeat
        env:
          RAISE_EXPECTED_REVISION: ${{ github.sha }}
          RAISE_SMOKE_REPORT: ${{ runner.temp }}/raise-smoke-repeat.json
        run: node deploy/smoke-live.mjs

      - name: Record machine-readable deploy evidence
        id: evidence
        if: always()
        env:
          RAISE_EVIDENCE_PATH: ${{ runner.temp }}/raise-gateway-deploy-evidence.json
          RAISE_INITIAL_SMOKE_REPORT: ${{ runner.temp }}/raise-smoke-initial.json
          RAISE_REPEAT_SMOKE_REPORT: ${{ runner.temp }}/raise-smoke-repeat.json
          RAISE_INITIAL_PAYLOAD_REPORT: ${{ runner.temp }}/raise-payload-initial.json
          RAISE_REPEAT_PAYLOAD_REPORT: ${{ runner.temp }}/raise-payload-repeat.json
          RAISE_DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RAISE_INITIAL_PAYLOAD_OUTCOME: ${{ steps.payload_initial.outcome }}
          RAISE_INITIAL_SMOKE_OUTCOME: ${{ steps.smoke_initial.outcome }}
          RAISE_IDEMPOTENCY_OUTCOME: ${{ steps.idempotency.outcome }}
          RAISE_REPEAT_PAYLOAD_OUTCOME: ${{ steps.payload_repeat.outcome }}
          RAISE_REPEAT_SMOKE_OUTCOME: ${{ steps.smoke_repeat.outcome }}
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          if [ -S "$XDG_RUNTIME_DIR/bus" ]; then
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          fi
          export RAISE_SYSTEMD_ACTIVE_STATE="$(systemctl --user show raise-gateway.service -p ActiveState --value 2>/dev/null || true)"
          export RAISE_SYSTEMD_SUB_STATE="$(systemctl --user show raise-gateway.service -p SubState --value 2>/dev/null || true)"
          node deploy/write-deploy-evidence.mjs
          {
            echo '### Machine-readable deploy evidence'
            echo '\`\`\`json'
            cat "$RAISE_EVIDENCE_PATH"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deploy evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raise-gateway-deploy-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/raise-gateway-deploy-evidence.json
            ${{ runner.temp }}/raise-ready-initial.json
            ${{ runner.temp }}/raise-ready-repeat.json
            ${{ runner.temp }}/raise-payload-initial.json
            ${{ runner.temp }}/raise-payload-repeat.json
          if-no-files-found: error
          retention-days: 30

      - name: Gate workflow on deploy evidence contract
        if: always()
        env:
          RAISE_EVIDENCE_PATH: ${{ runner.temp }}/raise-gateway-deploy-evidence.json
          RAISE_EXPECTED_REVISION: ${{ github.sha }}
        run: node deploy/validate-deploy-evidence.mjs
