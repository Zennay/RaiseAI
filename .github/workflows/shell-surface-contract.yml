name: Shell surface contract CI

on:
  push:
    branches:
      - main
    paths:
      - "*.command"
      - "**/*.command"
      - "*.sh"
      - "**/*.sh"
      - "gradlew"
      - "tests/test_shell_surface_contract.py"
      - ".github/workflows/shell-surface-contract.yml"
  pull_request:
    paths:
      - "*.command"
      - "**/*.command"
      - "*.sh"
      - "**/*.sh"
      - "gradlew"
      - "tests/test_shell_surface_contract.py"
      - ".github/workflows/shell-surface-contract.yml"

permissions:
  contents: read

concurrency:
  group: raise-shell-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Validate tracked shell surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = []
          for item in raw.decode("utf-8").split("\0"):
              if not item:
                  continue
              path = pathlib.PurePosixPath(item)
              if item == "gradlew" or path.suffix in {".command", ".sh"}:
                  paths.append(item)

          if not paths:
              raise SystemExit("no tracked shell entrypoints discovered")

          allowed = {"#!/bin/bash", "#!/usr/bin/env bash"}
          for path in sorted(paths):
              lines = pathlib.Path(path).read_text(encoding="utf-8").splitlines()
              if len(lines) < 2:
                  raise SystemExit(f"{path}: missing shebang/strict-mode preamble")
              if lines[0] not in allowed:
                  raise SystemExit(f"{path}: unsupported Bash shebang")
              if lines[1] != "set -euo pipefail":
                  raise SystemExit(f"{path}: strict mode must be the second line")
              subprocess.run(["bash", "-n", path], check=True)

          print(f"validated {len(paths)} tracked shell entrypoints")
          PY

      - name: Run shell surface regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_shell_surface_contract

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
