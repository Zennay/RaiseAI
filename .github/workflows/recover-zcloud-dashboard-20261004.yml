name: Restore zCloud guarded-deploy self-heal lock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-zcloud-dashboard-20261004.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 3
    steps:
      - name: Restore deploy self-heal guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          root=/home/ubuntu/zennay-cloud
          sudo -n install -o ubuntu -g ubuntu -m 0644 /dev/null "$root/.disable-self-heal"
          echo ZCLOUD_SELF_HEAL_GUARD_RESTORED
          ls -l "$root/.disable-self-heal"
          sudo -n systemctl is-active zennay-cloud.service
          sudo -n systemctl is-active zcloud-self-heal.timer || true
          curl -fsS --max-time 8 http://127.0.0.1:8765/ >/dev/null
          echo ZCLOUD_ROOT_LOCAL_GREEN
