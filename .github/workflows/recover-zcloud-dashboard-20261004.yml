name: Diagnose external zCloud status failure via RaiseAI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-zcloud-dashboard-20261004.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 5
    steps:
      - name: Capture status handler and recent errors
        shell: bash
        run: |
          set -euo pipefail
          root=/home/ubuntu/zennay-cloud
          echo "=== CURRENT SERVICE ==="
          sudo -n systemctl is-active zennay-cloud.service
          sudo -n ss -ltnp | grep ':8765'
          echo "=== RECENT JOURNAL ==="
          sudo -n journalctl -u zennay-cloud.service --since '2026-10-04 22:33:00 UTC' --no-pager | tail -n 320 || true
          echo "=== API STATUS ROUTE REFERENCES ==="
          grep -n -E "api/status|def status|def do_GET|status_payload|build_status|health" "$root/server.py" | tail -n 200 || true
          echo "=== DO_GET REGION ==="
          start="$(grep -n 'def do_GET' "$root/server.py" | tail -1 | cut -d: -f1)"
          if [[ "$start" =~ ^[0-9]+$ ]]; then
            sed -n "${start},$((start+220))p" "$root/server.py"
          fi
          echo "=== LOCAL STATUS TIMING ==="
          /usr/bin/time -f 'elapsed=%e cpu=%P maxrss=%M' curl -sS --max-time 25 -o /tmp/status.json -w 'HTTP=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:8765/api/status || true
          python3 -m json.tool /tmp/status.json 2>/dev/null | head -n 35 || true
