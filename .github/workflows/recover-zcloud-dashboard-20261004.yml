name: Roll back zCloud dashboard to last known good via RaiseAI runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-zcloud-dashboard-20261004.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 8
    steps:
      - name: Transactional zCloud last-known-good rollback
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          root=/home/ubuntu/zennay-cloud
          echo "pre_server_sha256=$(sha256sum "$root/server.py" | awk '{print $1}')"
          sudo -n rm -f "$root/.disable-self-heal"
          cd "$root"
          python3 scripts/zcloud_recovery.py rollback | tee /tmp/zcloud-rollback.json
          echo "post_server_sha256=$(sha256sum "$root/server.py" | awk '{print $1}')"
          sudo -n systemctl is-active zennay-cloud.service
          curl -fsS --max-time 8 http://127.0.0.1:8765/api/status >/tmp/zcloud-status.json
          echo ZCLOUD_LKG_LOCAL_GREEN
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/zcloud-status.json'))
          print(json.dumps({'time':s.get('time'),'errors':s.get('errors'),'dynamic_workers':s.get('dynamic_workers')},indent=2))
          PY
          sudo -n ss -ltnp | grep -E ':8765\b'

      - name: Recover zCloud Actions listener
        shell: bash
        run: |
          set -euo pipefail
          recovered=0
          mapfile -t system_units < <(
            systemctl list-unit-files --type=service --no-legend 2>/dev/null |
            awk '{print $1}' | grep -Ei '^actions\.runner\..*zcloud.*\.service$' || true
          )
          mapfile -t user_units < <(
            systemctl --user list-unit-files --type=service --no-legend 2>/dev/null |
            awk '{print $1}' | grep -Ei '^actions\.runner\..*zcloud.*\.service$' || true
          )
          for unit in "${system_units[@]}"; do
            sudo -n systemctl reset-failed "$unit" || true
            sudo -n systemctl restart "$unit" && recovered=1 || true
            sudo -n systemctl is-active "$unit" || true
          done
          for unit in "${user_units[@]}"; do
            systemctl --user reset-failed "$unit" || true
            systemctl --user restart "$unit" && recovered=1 || true
            systemctl --user is-active "$unit" || true
          done
          test "$recovered" -eq 1
          echo ZCLOUD_ACTIONS_LISTENER_RECOVERED

      - name: Verify existing public dashboard exposure
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS --max-time 8 http://198.244.191.182:8765/ >/dev/null; then
            echo ZCLOUD_DASHBOARD_PUBLIC_GREEN
          else
            echo ZCLOUD_PUBLIC_SELFTEST_FAILED
            sudo -n ufw status 2>/dev/null || true
            sudo -n nft list ruleset 2>/dev/null | grep -C 4 -E '8765|reject|drop' || true
            exit 3
          fi
