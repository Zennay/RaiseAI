name: Markdown surface contract CI

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "tests/test_markdown_surface_contract.py"
      - ".github/workflows/markdown-surface-contract.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "tests/test_markdown_surface_contract.py"
      - ".github/workflows/markdown-surface-contract.yml"

permissions:
  contents: read

concurrency:
  group: raise-markdown-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, vps-bb300bba]
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10), sys.version'

      - name: Run Markdown surface regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_markdown_surface_contract

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
