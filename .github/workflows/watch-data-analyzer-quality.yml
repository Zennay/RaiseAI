name: Watch data analyzer quality CI

on:
  push:
    branches:
      - main
    paths:
      - "analyze-watch-data.py"
      - "tests/test_watch_data_analyzer.py"
      - ".github/workflows/watch-data-analyzer-quality.yml"
  pull_request:
    paths:
      - "analyze-watch-data.py"
      - "tests/test_watch_data_analyzer.py"
      - ".github/workflows/watch-data-analyzer-quality.yml"

concurrency:
  group: raise-watch-data-analyzer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzer-quality:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=normal)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Compile analyzer
        run: python3 -m py_compile analyze-watch-data.py

      - name: Run analyzer regressions
        run: python3 -m unittest tests/test_watch_data_analyzer.py -v
