name: Raise Watch app CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "VERSION.txt"
      - "install-watch-apk.command"
      - "upgrade-watch.command"
      - "physical-validation.command"
      - "pull-diagnostics.command"
      - "pull-watch-data.command"
      - "provision-watch-gateway.command"
      - "tools/validate-watch-e2e-evidence.py"
      - "tools/analyze-watch-sensor-traces.py"
      - "tools/analyze-watch-sensor-trials.py"
      - "tests/test_watch_e2e_evidence_validator.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - ".github/workflows/watch-app-test.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "VERSION.txt"
      - "install-watch-apk.command"
      - "upgrade-watch.command"
      - "physical-validation.command"
      - "pull-diagnostics.command"
      - "pull-watch-data.command"
      - "provision-watch-gateway.command"
      - "tools/validate-watch-e2e-evidence.py"
      - "tools/analyze-watch-sensor-traces.py"
      - "tools/analyze-watch-sensor-trials.py"
      - "tests/test_watch_e2e_evidence_validator.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - ".github/workflows/watch-app-test.yml"

concurrency:
  group: raise-watch-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch-app:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pin exact build revision
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=normal)"
          revision="$(git rev-parse HEAD | tr 'A-F' 'a-f')"
          printf '%s' "$revision" | grep -Eq '^[0-9a-f]{40}$'
          echo "RAISE_BUILD_REVISION=$revision" >> "$GITHUB_ENV"
          echo "Pinned evidence build revision: $revision"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 35 toolchain
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Runner toolchain
        run: |
          java -version
          python3 --version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

      - name: Script syntax
        run: |
          bash -n pull-diagnostics.command
          bash -n pull-watch-data.command
          bash -n physical-validation.command
          bash physical-validation.command --help >/dev/null
          bash -n provision-watch-gateway.command
          bash -n install-watch-apk.command
          bash -n upgrade-watch.command
          python3 -m py_compile tools/validate-watch-e2e-evidence.py tools/analyze-watch-sensor-traces.py tools/analyze-watch-sensor-trials.py

      - name: Release version contract
        run: |
          expected="$(tr -d '\r\n' < VERSION.txt)"
          actual="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$expected" = "$actual"
          echo "Raise AI version: $actual"

      - name: Watch evidence contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_watch_e2e_evidence_validator.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trace_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trial_analyzer.py'

      - name: Unit tests and Watch APK
        run: |
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx1280m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=1 \
            :app:verifyEvidenceBuildIdentity testDebugUnitTest assembleDebug
          grep -R --fixed-strings "$RAISE_BUILD_REVISION" app/build/generated >/dev/null
          echo "Generated BuildConfig contains exact source revision: $RAISE_BUILD_REVISION"

      - name: Upload debug Watch APK
        uses: actions/upload-artifact@v4
        with:
          name: RaiseAI-Watch7-v1.5.1-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
