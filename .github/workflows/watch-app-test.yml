name: Raise Watch app CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "VERSION.txt"
      - "install-watch-apk.command"
      - "upgrade-watch.command"
      - "physical-validation.command"
      - "start-physical-handoff.command"
      - "pull-diagnostics.command"
      - "pull-watch-data.command"
      - "provision-watch-gateway.command"
      - "watch-battery-snapshot.command"
      - "tools/compare-watch-battery-snapshots.py"
      - "tools/validate-watch-e2e-evidence.py"
      - "tools/analyze-watch-sensor-traces.py"
      - "tools/analyze-watch-sensor-trials.py"
      - "tools/verify-watch-apk-identity.py"
      - "tests/test_watch_e2e_evidence_validator.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - "tests/test_watch_apk_identity.py"
      - "tests/test_watch_battery_evidence.py"
      - ".github/workflows/watch-app-test.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "VERSION.txt"
      - "install-watch-apk.command"
      - "upgrade-watch.command"
      - "physical-validation.command"
      - "start-physical-handoff.command"
      - "pull-diagnostics.command"
      - "pull-watch-data.command"
      - "provision-watch-gateway.command"
      - "tools/validate-watch-e2e-evidence.py"
      - "tools/analyze-watch-sensor-traces.py"
      - "tools/analyze-watch-sensor-trials.py"
      - "tools/verify-watch-apk-identity.py"
      - "tests/test_watch_e2e_evidence_validator.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - "tests/test_watch_apk_identity.py"
      - ".github/workflows/watch-app-test.yml"

concurrency:
  group: raise-watch-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch-app:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # PR validation must build the exact head commit, not GitHub's synthetic merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # The physical-handoff source bundle must contain the pinned revision's full ancestry.
          fetch-depth: 0

      - name: Pin exact build revision
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=normal)"
          revision="$(git rev-parse HEAD | tr 'A-F' 'a-f')"
          printf '%s' "$revision" | grep -Eq '^[0-9a-f]{40}$'
          echo "RAISE_BUILD_REVISION=$revision" >> "$GITHUB_ENV"
          echo "Pinned evidence build revision: $revision"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 35 toolchain
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Runner toolchain
        run: |
          java -version
          python3 --version
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

      - name: Script syntax
        run: |
          bash -n pull-diagnostics.command
          bash -n pull-watch-data.command
          bash -n physical-validation.command
          bash physical-validation.command --help >/dev/null
          bash -n start-physical-handoff.command
          bash -n provision-watch-gateway.command
          bash -n install-watch-apk.command
          bash -n upgrade-watch.command
          bash -n watch-battery-snapshot.command
          bash watch-battery-snapshot.command --help >/dev/null
          python3 -m py_compile tools/compare-watch-battery-snapshots.py tools/validate-watch-e2e-evidence.py tools/analyze-watch-sensor-traces.py tools/analyze-watch-sensor-trials.py tools/verify-watch-apk-identity.py

      - name: Prebuilt artifact digest contract
        shell: bash
        run: |
          set -euo pipefail
          tmp_apk="$(mktemp)"
          tmp_profile="$(mktemp)"
          tmp_log="$(mktemp)"
          tmp_evidence="$(mktemp -d)"
          trap 'rm -f "$tmp_apk" "$tmp_profile" "$tmp_log"; rm -rf "$tmp_evidence"' EXIT

          if RAISE_EVIDENCE_ROOT="$tmp_evidence" RAISE_PREBUILT_APK="$tmp_apk" \
            bash physical-validation.command prepare "$tmp_profile" >"$tmp_log" 2>&1; then
            cat "$tmp_log"
            echo "Prebuilt validation unexpectedly accepted an APK without an expected SHA-256."
            exit 1
          fi
          grep -Fq "RAISE_EXPECT_APK_SHA256 is required when RAISE_PREBUILT_APK is set." "$tmp_log" || {
            cat "$tmp_log"
            echo "Missing prebuilt digest failed for an unexpected reason."
            exit 1
          }
          echo "Negative control passed: prebuilt mode requires an exact APK SHA-256."

      - name: Release version contract
        run: |
          expected="$(tr -d '\r\n' < VERSION.txt)"
          actual="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$expected" = "$actual"
          echo "Raise AI version: $actual"

      - name: Watch evidence contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_watch_e2e_evidence_validator.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trace_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_watch_sensor_trial_analyzer.py'
          python3 -m unittest discover -s tests -p 'test_watch_apk_identity.py'
          python3 -m unittest discover -s tests -p 'test_watch_battery_evidence.py'

      - name: Evidence identity negative controls
        shell: bash
        run: |
          set -euo pipefail
          gradle=(
            ./gradlew --no-daemon
            -Dorg.gradle.jvmargs="-Xmx1280m -Dfile.encoding=UTF-8"
            -Dorg.gradle.workers.max=1
            :app:verifyEvidenceBuildIdentity
          )

          wrong_revision="0000000000000000000000000000000000000000"
          wrong_log="$(mktemp)"
          if RAISE_BUILD_REVISION="$wrong_revision" "${gradle[@]}" >"$wrong_log" 2>&1; then
            cat "$wrong_log"
            echo "Identity gate unexpectedly accepted a revision that does not match HEAD."
            exit 1
          fi
          grep -Fq "Pinned build revision does not match checked-out HEAD" "$wrong_log" || {
            cat "$wrong_log"
            echo "Mismatched-revision control failed for an unexpected reason."
            exit 1
          }
          rm -f "$wrong_log"
          echo "Negative control passed: mismatched revision rejected for HEAD mismatch."

          dirty_log="$(mktemp)"
          trap 'git checkout -- VERSION.txt; rm -f "$dirty_log"' EXIT
          printf '\n' >> VERSION.txt
          if "${gradle[@]}" >"$dirty_log" 2>&1; then
            cat "$dirty_log"
            echo "Identity gate unexpectedly accepted a dirty working tree."
            exit 1
          fi
          grep -Fq "Evidence-capable builds require a clean Git working tree" "$dirty_log" || {
            cat "$dirty_log"
            echo "Dirty-tree control failed for an unexpected reason."
            exit 1
          }
          git checkout -- VERSION.txt
          rm -f "$dirty_log"
          trap - EXIT
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo "Negative control passed: dirty working tree rejected for cleanliness."

      - name: Unit tests and Watch APK
        run: |
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx1280m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=1 \
            :app:verifyEvidenceBuildIdentity testDebugUnitTest assembleDebug
          grep -R --fixed-strings "$RAISE_BUILD_REVISION" app/build/generated >/dev/null
          echo "Generated BuildConfig contains exact source revision: $RAISE_BUILD_REVISION"
          python3 - <<'PY'
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          metadata_path = Path("app/build/outputs/apk/debug/output-metadata.json")
          revision = os.environ["RAISE_BUILD_REVISION"].encode("ascii")

          with zipfile.ZipFile(apk) as archive:
              dex_files = [name for name in archive.namelist() if name.endswith(".dex")]
              hits = [name for name in dex_files if revision in archive.read(name)]
          if not hits:
              raise SystemExit("exact source revision not embedded in APK DEX")

          gradle = Path("app/build.gradle.kts").read_text()
          version_name = Path("VERSION.txt").read_text().strip()
          match = re.search(r"versionCode\s*=\s*(\d+)", gradle)
          if not match:
              raise SystemExit("versionCode not found in app/build.gradle.kts")
          version_code = int(match.group(1))

          metadata = json.loads(metadata_path.read_text())
          element = metadata["elements"][0]
          if element.get("versionName") != version_name or element.get("versionCode") != version_code:
              raise SystemExit(
                  f"APK metadata mismatch: expected {version_code}/{version_name}, "
                  f"got {element.get('versionCode')}/{element.get('versionName')}"
              )

          print("APK DEX contains exact source revision:", ", ".join(hits))
          print("APK release identity:", version_code, version_name)
          PY

      - name: Build and verify physical handoff
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION.txt)"
          handoff_dir="$RUNNER_TEMP/raiseai-physical-handoff"
          restore_dir="$RUNNER_TEMP/raiseai-physical-handoff-verify"
          rm -rf "$handoff_dir" "$restore_dir"
          mkdir -p "$handoff_dir"

          apk="$handoff_dir/RaiseAI-v${version}-debug.apk"
          bundle="$handoff_dir/RaiseAI-v${version}-source.bundle"
          identity="$handoff_dir/BUILD-IDENTITY.txt"

          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cp start-physical-handoff.command "$handoff_dir/start-physical-handoff.command"
          chmod +x "$handoff_dir/start-physical-handoff.command"

          git branch -f physical-handoff "$RAISE_BUILD_REVISION"
          git bundle create "$bundle" refs/heads/physical-handoff
          git branch -D physical-handoff

          apk_sha="$(sha256sum "$apk" | awk '{print tolower($1)}')"
          bundle_sha="$(sha256sum "$bundle" | awk '{print tolower($1)}')"
          cat > "$identity" <<EOF
          source_revision=$RAISE_BUILD_REVISION
          apk_sha256=$apk_sha
          source_bundle_sha256=$bundle_sha
          EOF

          RAISE_RESTORE_DIR="$restore_dir" \
            bash "$handoff_dir/start-physical-handoff.command" --verify-only
          rm -rf "$restore_dir"

          echo "RAISE_HANDOFF_DIR=$handoff_dir" >> "$GITHUB_ENV"
          echo "RAISE_HANDOFF_VERSION=$version" >> "$GITHUB_ENV"

      - name: Upload exact main physical handoff
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RaiseAI-Watch7-v${{ env.RAISE_HANDOFF_VERSION }}-physical-handoff-${{ github.run_id }}
          path: ${{ env.RAISE_HANDOFF_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug Watch APK
        uses: actions/upload-artifact@v4
        with:
          name: RaiseAI-Watch7-v1.5.2-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
