# retrigger worker live proof 2026-10-06T06:46Z
name: Prove and recover seven zCloud workers live

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-workers-live-recovery-20261006.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: raiseai-zcloud-workers-live-recovery-20261006
  cancel-in-progress: true

jobs:
  prove:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 5
    steps:
      - name: Prove or recover allocated workers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "vps-bb300bba"
          python3 - <<'PY'
          import json, os, time, urllib.request

          base="http://127.0.0.1:8765"

          def call(method,path,payload=None,attempts=6):
              last=None
              for attempt in range(1,attempts+1):
                  try:
                      data=None
                      headers={"User-Agent":"raiseai-zcloud-workers-live/1"}
                      if payload is not None:
                          data=json.dumps(payload).encode()
                          headers["Content-Type"]="application/json"
                      req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
                      with urllib.request.urlopen(req,timeout=15) as r:
                          return json.load(r)
                  except Exception as exc:
                      last=exc
                      print(f"API_RETRY path={path} attempt={attempt} error={exc!r}",flush=True)
                      time.sleep(2)
              raise last

          def snapshot():
              targets=call("GET","/api/runner-targets")
              live=call("GET","/api/runner-live")
              allocation=(targets.get("global_allocation") or {}).get("workers") or []
              keys=[str(w.get("worker_key") or "") for w in allocation if w.get("worker_key")]
              runners=live.get("chatgpt_runners") or {}
              states={}
              for key in keys:
                  base_project=key.split("::w",1)[0]
                  row=None
                  for worker in ((runners.get(base_project) or {}).get("workers") or []):
                      if worker.get("worker_id")==key:
                          row=worker
                          break
                  states[key]={
                      "state":(row or {}).get("state"),
                      "age_seconds":(row or {}).get("age_seconds"),
                      "generating":(row or {}).get("generating"),
                      "sending":(row or {}).get("sending"),
                  }
              return keys,states

          keys,states=snapshot()
          if len(keys)!=7:
              raise SystemExit("expected seven allocated workers: "+json.dumps(keys))

          def is_live(row):
              if row.get("state")!="live":
                  return False
              age=row.get("age_seconds")
              return age is None or int(age)<=120

          missing=[k for k in keys if not is_live(states.get(k) or {})]
          print("WORKER_LIVE_INITIAL="+json.dumps({"keys":keys,"states":states,"missing":missing},sort_keys=True))

          if missing:
              for key in missing:
                  try:
                      result=call("POST","/api/runner-control",{"project_id":key,"action":"new_chat"})
                      print("WORKER_NEW_CHAT="+json.dumps({"worker":key,"result":result},sort_keys=True))
                  except Exception as exc:
                      print("WORKER_NEW_CHAT_ERROR="+json.dumps({"worker":key,"error":repr(exc)},sort_keys=True))
              time.sleep(12)
              keys,states=snapshot()
              missing=[k for k in keys if not is_live(states.get(k) or {})]

          if missing:
              try:
                  restart=call("POST","/api/runner-control",{"project_id":"","action":"restart_firefox"})
                  print("WORKER_FIREFOX_RESTART="+json.dumps(restart,sort_keys=True))
              except Exception as exc:
                  print("WORKER_FIREFOX_RESTART_ERROR="+repr(exc))
              time.sleep(18)
              keys,states=snapshot()
              missing=[k for k in keys if not is_live(states.get(k) or {})]

          evidence={"keys":keys,"states":states,"missing":missing}
          print("WORKER_LIVE_FINAL="+json.dumps(evidence,sort_keys=True))

          state="success" if len(keys)==7 and not missing else "failure"
          repo=os.environ["GITHUB_REPOSITORY"]; sha=os.environ["GITHUB_SHA"]; token=os.environ["GH_TOKEN"]
          payload=json.dumps({
              "state":state,
              "context":"zcloud/workers-live",
              "description":f"seven-worker live proof {state}; live={len(keys)-len(missing)}/7",
              "target_url":f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload,method="POST",
              headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"raiseai-zcloud-workers-live",
              })
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==201

          if missing:
              raise SystemExit("workers not live after recovery: "+json.dumps(missing))
          PY
