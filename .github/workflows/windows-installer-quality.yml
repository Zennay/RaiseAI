name: Windows installer quality CI

on:
  push:
    branches:
      - main
    paths:
      - "install-watch-windows.ps1"
      - "tests/test_windows_installer_contract.py"
      - ".github/workflows/windows-installer-quality.yml"
  pull_request:
    paths:
      - "install-watch-windows.ps1"
      - "tests/test_windows_installer_contract.py"
      - ".github/workflows/windows-installer-quality.yml"

permissions:
  contents: read

concurrency:
  group: raise-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer-quality:
    runs-on: [self-hosted, linux, x64, vps-bb300bba]
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run Windows installer contract regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_windows_installer_contract.py -v
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
