# retrigger final public verification 2026-10-06T06:52Z
name: Verify public zCloud now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-public-verify-now-20261006.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public dashboard API and worker allocation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request

          base="http://198.244.191.182:8765"
          repo=os.environ["GITHUB_REPOSITORY"]; sha=os.environ["GITHUB_SHA"]; token=os.environ["GH_TOKEN"]

          pending=json.dumps({
              "state":"pending",
              "context":"zcloud/public-final",
              "description":"external zCloud verification running",
              "target_url":f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          preq=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=pending,method="POST",
              headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"raiseai-zcloud-public-final-verify",
              })
          with urllib.request.urlopen(preq,timeout=20) as r:
              assert r.status==201

          evidence={}
          ok=False
          for attempt in range(1,7):
              try:
                  with urllib.request.urlopen(base+"/",timeout=12) as r:
                      root_status=r.status
                      r.read(256)
                  with urllib.request.urlopen(base+"/api/status",timeout=20) as r:
                      status=json.load(r)
                  with urllib.request.urlopen(base+"/api/runner-targets",timeout=20) as r:
                      targets=json.load(r)
                  allocation=(targets.get("global_allocation") or {}).get("workers") or []
                  evidence={
                      "attempt":attempt,
                      "root_http":root_status,
                      "status_time":status.get("time"),
                      "errors":status.get("errors"),
                      "allocation_count":len(allocation),
                      "workers":[w.get("worker_key") for w in allocation],
                  }
                  if root_status==200 and status.get("time") and len(allocation)==7:
                      ok=True
                      break
              except Exception as exc:
                  evidence={"attempt":attempt,"error":repr(exc)}
              time.sleep(5)

          print("ZCLOUD_PUBLIC_FINAL_VERIFY="+json.dumps(evidence,sort_keys=True),flush=True)
          state="success" if ok else "failure"
          payload=json.dumps({
              "state":state,
              "context":"zcloud/public-final",
              "description":f"public zCloud {state}; workers={evidence.get('allocation_count','?')}/7",
              "target_url":f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload,method="POST",
              headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"raiseai-zcloud-public-final-verify",
              })
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==201
          if not ok:
              raise SystemExit("public zCloud verification failed")
          PY
