name: Recover public zCloud dashboard ingress
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-public-dashboard-recovery-20261004.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raiseai-zcloud-public-dashboard-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 6
    steps:
      - name: Inspect listener and firewall
        shell: bash
        run: |
          set -euo pipefail
          echo "=== service ==="
          sudo -n systemctl --no-pager --full status zennay-cloud.service || true
          echo "=== unit ==="
          sudo -n systemctl cat zennay-cloud.service || true
          echo "=== listener ==="
          sudo -n ss -ltnp '( sport = :8765 )' || true
          echo "=== ufw ==="
          sudo -n ufw status verbose || true
          echo "=== nft input ==="
          sudo -n nft list ruleset 2>/dev/null | grep -E -C 3 '8765|hook input|policy' || true
          echo "=== local ==="
          curl -fsS --max-time 8 http://127.0.0.1:8765/ >/dev/null
          echo "LOCAL_ZCLOUD_DASHBOARD_GREEN=1"

      - name: Inspect public IP and host input path
        shell: bash
        run: |
          set -euo pipefail
          echo "=== addresses ==="
          ip -4 -br addr
          echo "=== route ==="
          ip -4 route
          echo "=== detected public IP ==="
          public_ip="$(curl -4 -fsS --max-time 10 https://api.ipify.org || true)"
          echo "PUBLIC_IPV4=$public_ip"
          echo "=== iptables input ==="
          sudo -n iptables -S INPUT || true
          echo "=== nft input hooks ==="
          sudo -n nft -a list ruleset 2>/dev/null | grep -E -C 5 'hook input|chain INPUT|dport 8765|tcp dport' || true
          echo "=== self via configured public IP ==="
          if [ -n "$public_ip" ]; then
            curl -sv --connect-timeout 5 --max-time 10 "http://$public_ip:8765/" -o /dev/null 2>&1 | tail -30 || true
          fi

      - name: Ensure public bind and host firewall rule
        shell: bash
        run: |
          set -euo pipefail
          listener="$(sudo -n ss -H -ltn '( sport = :8765 )' || true)"
          echo "LISTENER_BEFORE=$listener"
          if ! grep -Eq '(^|[[:space:]])(0\.0\.0\.0:8765|\*:8765|\[::\]:8765)([[:space:]]|$)' <<<"$listener"; then
            echo "ZCLOUD_PUBLIC_BIND_RECOVERY=required"
            sudo -n install -d -m 0755 /etc/systemd/system/zennay-cloud.service.d
            printf '%s\n' '[Service]' 'Environment=ZENNAY_BIND=0.0.0.0' 'Environment=ZENNAY_PORT=8765'               | sudo -n tee /etc/systemd/system/zennay-cloud.service.d/20-public-dashboard.conf >/dev/null
            sudo -n systemctl daemon-reload
            timeout 25s sudo -n systemctl restart zennay-cloud.service
          else
            echo "ZCLOUD_PUBLIC_BIND_RECOVERY=already_public"
          fi

          if sudo -n ufw status 2>/dev/null | head -1 | grep -q 'Status: active'; then
            if ! sudo -n ufw status | grep -Eq '(^|[[:space:]])8765(/tcp)?([[:space:]]|$)'; then
              sudo -n ufw allow 8765/tcp comment 'zCloud dashboard'
              echo "ZCLOUD_UFW_8765=added"
            else
              echo "ZCLOUD_UFW_8765=already_allowed"
            fi
          else
            echo "ZCLOUD_UFW=inactive_or_unavailable"
          fi

          for _ in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:8765/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 8 http://127.0.0.1:8765/ >/dev/null
          listener="$(sudo -n ss -H -ltn '( sport = :8765 )' || true)"
          echo "LISTENER_AFTER=$listener"
          grep -Eq '(^|[[:space:]])(0\.0\.0\.0:8765|\*:8765|\[::\]:8765)([[:space:]]|$)' <<<"$listener"
          echo "ZCLOUD_PUBLIC_LISTENER_GREEN=1"

      - name: Final host evidence
        if: always()
        shell: bash
        run: |
          set +e
          sudo -n systemctl --no-pager --full status zennay-cloud.service | tail -80
          sudo -n ss -ltnp '( sport = :8765 )'
          sudo -n ufw status verbose
