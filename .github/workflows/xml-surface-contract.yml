name: XML surface contract CI

on:
  push:
    branches:
      - main
    paths:
      - "*.xml"
      - "**/*.xml"
      - "tests/test_xml_surface_contract.py"
      - ".github/workflows/xml-surface-contract.yml"
  pull_request:
    paths:
      - "*.xml"
      - "**/*.xml"
      - "tests/test_xml_surface_contract.py"
      - ".github/workflows/xml-surface-contract.yml"

permissions:
  contents: read

concurrency:
  group: raise-xml-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Validate tracked XML surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          FORBIDDEN_DECLARATIONS = ("<!DOCTYPE", "<!ENTITY")
          UTF8_BOM = b"\xef\xbb\xbf"
          BIDI_CONTROL_RE = re.compile("[\u061c\u200e\u200f\u202a-\u202e\u2066-\u2069]")

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = sorted(
              item
              for item in raw.decode("utf-8").split("\0")
              if item and pathlib.PurePosixPath(item).suffix.lower() == ".xml"
          )
          if not paths:
              raise SystemExit("no tracked XML files discovered")

          for path in paths:
              candidate = pathlib.Path(path)
              if candidate.is_symlink():
                  raise SystemExit(f"{path}: tracked XML files must not be symlinks")
              if not candidate.is_file():
                  raise SystemExit(f"{path}: tracked XML path must be a regular file")

              data = candidate.read_bytes()
              if data.startswith(UTF8_BOM):
                  raise SystemExit(f"{path}: XML source must not start with a UTF-8 BOM")
              if b"\x00" in data:
                  raise SystemExit(f"{path}: XML source must not contain NUL bytes")
              if b"\r" in data:
                  raise SystemExit(f"{path}: XML source must use LF-only line endings")
              try:
                  text = data.decode("utf-8", errors="strict")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"{path}: XML source must be strict UTF-8: {exc}") from None
              if BIDI_CONTROL_RE.search(text):
                  raise SystemExit(f"{path}: XML source must not contain bidirectional control characters")
              upper = text.upper()
              for declaration in FORBIDDEN_DECLARATIONS:
                  if declaration in upper:
                      raise SystemExit(f"{path}: DTD/entity declarations are forbidden")
              try:
                  ET.fromstring(text)
              except ET.ParseError as exc:
                  raise SystemExit(f"{path}: invalid XML syntax: {exc}") from None

          print(f"validated {len(paths)} tracked XML files")
          PY

      - name: Run XML surface regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_xml_surface_contract

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
