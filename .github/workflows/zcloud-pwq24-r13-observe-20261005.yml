name: Observe zCloud PWQ-24 r13 live acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-pwq24-r13-observe-20261005.yml"

permissions:
  contents: read

jobs:
  observe:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 3
    steps:
      - name: Read current FTMO and Supa acceptance evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "vps-bb300bba"
          python3 - <<'PY'
          import json
          import sqlite3
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8765/api/runner-targets", timeout=30) as response:
              targets = json.load(response)

          allocation = targets.get("global_allocation") or {}
          guard = allocation.get("memory_guard") or (targets.get("dynamic_workers") or {}).get("memory_guard") or {}
          selected = allocation.get("workers") or []
          print("PWQ24_OBSERVER_ALLOCATION=" + json.dumps({
              "workers": selected,
              "memory_guard": guard,
              "max_workers": targets.get("max_workers"),
          }, sort_keys=True))

          db = "/home/ubuntu/zennay-cloud/history.db"
          with sqlite3.connect(db, timeout=5) as conn:
              conn.row_factory = sqlite3.Row
              for project in ("ftmo", "supa"):
                  events = conn.execute(
                      """SELECT id,ts,event,project_id,worker_slot,generating,sending,reason,error
                         FROM runner_events
                         WHERE project_id=?
                         ORDER BY id DESC LIMIT 20""",
                      (project,),
                  ).fetchall()
                  commands = conn.execute(
                      """SELECT id,created_at,project_id,action,status,result
                         FROM runner_commands
                         WHERE project_id=? OR project_id LIKE ?
                         ORDER BY id DESC LIMIT 12""",
                      (project, project + "::w%"),
                  ).fetchall()
                  print("PWQ24_OBSERVER_EVENTS_" + project.upper() + "=" + json.dumps(
                      [dict(row) for row in reversed(events)], sort_keys=True
                  ))
                  print("PWQ24_OBSERVER_COMMANDS_" + project.upper() + "=" + json.dumps(
                      [dict(row) for row in reversed(commands)], sort_keys=True
                  ))
          print("PWQ24_R13_OBSERVER_GREEN")
          PY
