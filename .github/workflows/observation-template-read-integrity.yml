name: Observation template read integrity CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/create-physical-observation-template.py"
      - "tests/test_physical_observation_template.py"
      - "tests/test_observation_template_read_workflow.py"
      - ".github/workflows/observation-template-read-integrity.yml"
  pull_request:
    paths:
      - "tools/create-physical-observation-template.py"
      - "tests/test_physical_observation_template.py"
      - "tests/test_observation_template_read_workflow.py"
      - ".github/workflows/observation-template-read-integrity.yml"

permissions:
  contents: read

concurrency:
  group: raise-observation-template-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observation-template-read-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/raise-observation-template-pyc
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Compile observation tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/create-physical-observation-template.py

      - name: Run observation template regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_physical_observation_template tests.test_observation_template_read_workflow -v

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
