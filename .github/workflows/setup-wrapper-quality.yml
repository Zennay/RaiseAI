name: Setup wrapper quality CI

on:
  push:
    branches:
      - main
    paths:
      - "setup-and-install-watch.command"
      - "tests/test_setup_install_wrapper.py"
      - ".github/workflows/setup-wrapper-quality.yml"
  pull_request:
    paths:
      - "setup-and-install-watch.command"
      - "tests/test_setup_install_wrapper.py"
      - ".github/workflows/setup-wrapper-quality.yml"

permissions:
  contents: read

concurrency:
  group: setup-wrapper-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: [self-hosted, linux, x64, vps-bb300bba]
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pin exact head and runner
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Validate setup wrapper
        shell: bash
        run: |
          set -euo pipefail
          bash -n setup-and-install-watch.command
          python3 -m unittest discover -s tests -p 'test_setup_install_wrapper.py' -v
