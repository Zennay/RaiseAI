# retrigger 2026-10-06T06:29Z
name: Emergency restore zCloud control plane and workers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-emergency-restore-20261006.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: raiseai-zcloud-emergency-restore-20261006
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 8
    steps:
      - name: Mark recovery pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "vps-bb300bba"
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; sha=os.environ["GITHUB_SHA"]; token=os.environ["GH_TOKEN"]
          payload=json.dumps({
              "state":"pending",
              "context":"zcloud/raiseai-emergency-restore",
              "description":"RaiseAI VPS runner recovery started",
              "target_url":f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload, method="POST",
              headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"raiseai-zcloud-emergency-restore",
              })
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status == 201
          PY

      - name: Repair SQLite and restore zCloud service
        shell: bash
        run: |
          set -euo pipefail
          root="/home/ubuntu/zennay-cloud"
          db="$root/history.db"
          service="zennay-cloud.service"

          sudo -n rm -f "$root/.disable-self-heal"
          service_user="$(systemctl show "$service" -p User --value 2>/dev/null || true)"
          [[ -n "$service_user" ]] || service_user="root"
          service_group="$(systemctl show "$service" -p Group --value 2>/dev/null || true)"
          [[ -n "$service_group" ]] || service_group="$(id -gn "$service_user")"

          sudo -n systemctl stop "$service" || true
          sudo -n chown "$service_user:$service_group" "$root" "$db"
          sudo -n chmod u+rwx "$root"
          sudo -n chmod u+rw "$db"

          for candidate in "$db-wal" "$db-shm"; do
            [[ -e "$candidate" ]] || continue
            attrs="$(lsattr -d "$candidate" 2>/dev/null | awk '{print $1}' || true)"
            [[ "$attrs" != *i* ]] || sudo -n chattr -i "$candidate"
            sudo -n chown "$service_user:$service_group" "$candidate"
            sudo -n chmod u+rw "$candidate"
          done

          sudo -n -u "$service_user" python3 - <<'PY'
          import sqlite3
          db="/home/ubuntu/zennay-cloud/history.db"
          conn=sqlite3.connect(db, timeout=10)
          try:
              conn.execute("BEGIN IMMEDIATE")
              conn.rollback()
          finally:
              conn.close()
          print("ZCLOUD_SQLITE_WRITE_PROBE_GREEN")
          PY

          sudo -n systemctl reset-failed "$service" || true
          if ! timeout 20s sudo -n systemctl restart "$service"; then
            sudo -n systemctl kill --kill-whom=all --signal=KILL "$service" || true
            sleep 2
            sudo -n systemctl reset-failed "$service" || true
            timeout 20s sudo -n systemctl start "$service"
          fi

          for _ in $(seq 1 30); do
            if sudo -n systemctl is-active --quiet "$service" &&
               curl -fsS --max-time 5 http://127.0.0.1:8765/api/status >/tmp/zcloud-emergency-status.json 2>/dev/null; then
              echo "ZCLOUD_SERVICE_LOCAL_GREEN=1"
              break
            fi
            sleep 1
          done
          sudo -n systemctl is-active --quiet "$service"
          curl -fsS --max-time 8 http://127.0.0.1:8765/api/status >/tmp/zcloud-emergency-status.json

          listener="$(ss -lnt | awk '$4 ~ /:8765$/ {print $4; exit}')"
          echo "ZCLOUD_LISTENER_BEFORE_PUBLIC_REPAIR=${listener:-missing}"
          if [[ "${listener:-}" == 127.0.0.1:8765 || "${listener:-}" == localhost:8765 ]]; then
            tmp="$(mktemp)"
            cat > "$tmp" <<'DROPIN'
          [Service]
          Environment=ZENNAY_BIND=0.0.0.0
          Environment=ZENNAY_PORT=8765
          DROPIN
            sudo -n install -d -m 0755 /etc/systemd/system/zennay-cloud.service.d
            sudo -n install -m 0644 "$tmp" /etc/systemd/system/zennay-cloud.service.d/20-dashboard-public-bind.conf
            rm -f "$tmp"
            sudo -n systemctl daemon-reload
            sudo -n systemctl restart "$service"
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:8765/api/status >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
          fi
          listener="$(ss -lnt | awk '$4 ~ /:8765$/ {print $4; exit}')"
          echo "ZCLOUD_LISTENER_AFTER_PUBLIC_REPAIR=${listener:-missing}"
          [[ "${listener:-}" == "0.0.0.0:8765" || "${listener:-}" == "*:8765" || "${listener:-}" == "[::]:8765" ]]

          if command -v ufw >/dev/null 2>&1; then
            ufw_status="$(sudo -n ufw status 2>/dev/null || true)"
            echo "$ufw_status"
            if grep -Fq "Status: active" <<<"$ufw_status" && ! grep -Eq '(^|[[:space:]])8765(/tcp)?([[:space:]]|$)' <<<"$ufw_status"; then
              sudo -n ufw allow 8765/tcp comment 'zCloud dashboard'
              echo "ZCLOUD_UFW_8765_RESTORED=1"
            fi
          fi

      - name: Restore zCloud Actions listener
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t units < <(
            systemctl list-unit-files --type=service --no-legend 2>/dev/null |
            awk '{print $1}' |
            grep -Ei '^actions\.runner\..*zcloud.*\.service$' || true
          )
          if (( ${#units[@]} == 0 )); then
            echo "No zCloud Actions runner service found" >&2
            exit 3
          fi
          restored=0
          for unit in "${units[@]}"; do
            echo "RESTORE_ZCLOUD_RUNNER=$unit"
            if sudo -n systemctl reset-failed "$unit" >/dev/null 2>&1 || true; then :; fi
            if sudo -n systemctl restart "$unit"; then
              sudo -n systemctl is-active --quiet "$unit"
              restored=1
            fi
          done
          test "$restored" -eq 1
          echo "ZCLOUD_ACTIONS_RUNNER_GREEN=1"

      - name: Restore seven workers and force work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request

          base="http://127.0.0.1:8765"

          def call(method,path,payload=None):
              data=None
              headers={"User-Agent":"raiseai-zcloud-emergency-restore/1"}
              if payload is not None:
                  data=json.dumps(payload).encode("utf-8")
                  headers["Content-Type"]="application/json"
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=20) as response:
                  return json.load(response)

          current=(call("GET","/api/dynamic-workers").get("dynamic_workers") or {})
          desired={
              key: current.get(key)
              for key in (
                  "chatgpt_count","claude_count",
                  "chatgpt_cooldown_seconds","claude_cooldown_seconds",
                  "check_interval_ms","tick_interval_ms","heartbeat_interval_ms",
                  "generation_start_timeout_ms","scheduler_interval_seconds",
              )
              if current.get(key) is not None
          }
          desired["chatgpt_count"]=7
          reconciled=call("POST","/api/dynamic-workers",desired)
          if not reconciled.get("ok"):
              raise SystemExit("worker capacity reconcile failed: "+json.dumps(reconciled,sort_keys=True))

          targets=call("GET","/api/runner-targets")
          allocation=(targets.get("global_allocation") or {}).get("workers") or []
          if len(allocation) != 7:
              raise SystemExit("expected seven allocated workers: "+json.dumps(allocation,sort_keys=True))

          import sqlite3
          db="/home/ubuntu/zennay-cloud/history.db"
          conn=sqlite3.connect(db, timeout=15)
          try:
              conn.execute("PRAGMA busy_timeout=15000")
              conn.execute("BEGIN IMMEDIATE")
              repaired=[]
              for item in allocation:
                  project=str(item.get("project_id") or "").strip()
                  slot=int(item.get("worker_slot") or 1)
                  if not project:
                      continue
                  conn.execute(
                      "UPDATE runner_workers SET desired_state='running' WHERE project_id=? AND worker_slot=?",
                      (project,slot),
                  )
                  repaired.append(f"{project}::w{slot}")
              conn.commit()
          finally:
              conn.close()
          print("WORKER_DESIRED_STATE_REPAIRED="+json.dumps(repaired,sort_keys=True))

          pushed=call("POST","/api/dynamic-workers/force-push",{})
          print("WORKER_CAPACITY_RECONCILED="+json.dumps(reconciled,sort_keys=True))
          print("WORKERS_FORCE_PUSHED="+json.dumps(pushed,sort_keys=True))
          print("WORKER_ALLOCATION="+json.dumps(allocation,sort_keys=True))
          if not pushed.get("ok"):
              raise SystemExit("worker force-push failed: "+json.dumps(pushed,sort_keys=True))
          refused=[r for r in (pushed.get("results") or []) if not r.get("queued")]
          if refused:
              raise SystemExit("one or more workers refused push: "+json.dumps(refused,sort_keys=True))
          PY

      - name: Publish recovery result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          state="success" if os.environ.get("JOB_STATUS") == "success" else "failure"
          repo=os.environ["GITHUB_REPOSITORY"]; sha=os.environ["GITHUB_SHA"]; token=os.environ["GH_TOKEN"]
          payload=json.dumps({
              "state":state,
              "context":"zcloud/raiseai-emergency-restore",
              "description":"zCloud service + listener + seven-worker restore " + state,
              "target_url":f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload, method="POST",
              headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"raiseai-zcloud-emergency-restore",
              })
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status == 201
          print("ZCLOUD_RAISEAI_RECOVERY_STATUS="+state)
          PY


  verify-public:
    needs: recover
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify zCloud externally and publish result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_RESULT: ${{ needs.recover.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]; sha=os.environ["GITHUB_SHA"]; token=os.environ["GH_TOKEN"]
          base="http://198.244.191.182:8765"
          ok=False
          evidence={}
          for attempt in range(1,9):
              try:
                  with urllib.request.urlopen(base+"/api/status",timeout=10) as r:
                      status=json.load(r)
                  with urllib.request.urlopen(base+"/api/runner-targets",timeout=10) as r:
                      targets=json.load(r)
                  allocation=(targets.get("global_allocation") or {}).get("workers") or []
                  evidence={
                      "attempt":attempt,
                      "status_time":status.get("time"),
                      "allocation_count":len(allocation),
                      "workers":[w.get("worker_key") for w in allocation],
                  }
                  if status.get("time") and len(allocation) == 7:
                      ok=True
                      break
              except Exception as exc:
                  evidence={"attempt":attempt,"error":repr(exc)}
              time.sleep(5)

          state="success" if ok else "failure"
          print("ZCLOUD_EXTERNAL_VERIFY="+json.dumps(evidence,sort_keys=True))
          payload=json.dumps({
              "state":state,
              "context":"zcloud/public-api-verify",
              "description":(
                  f"external API + 7-worker allocation {state}; "
                  f"count={evidence.get('allocation_count','?')}"
              )[:140],
              "target_url":f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload, method="POST",
              headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
                  "User-Agent":"raiseai-zcloud-public-verify",
              })
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status == 201
          if not ok:
              raise SystemExit("public zCloud verification failed")
          PY


  diagnose-public-failure:
    needs: [recover, verify-public]
    if: needs.recover.result == 'success' && needs.verify-public.result == 'failure'
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 3
    steps:
      - name: Capture public API failure evidence
        shell: bash
        run: |
          set +e
          echo "=== listener ==="
          ss -lntp | grep -E '(:8765[[:space:]])' || true
          echo "=== local root ==="
          curl -i --max-time 8 http://127.0.0.1:8765/ | head -40
          echo "=== local status ==="
          curl -i --max-time 12 http://127.0.0.1:8765/api/status | head -80
          echo "=== public self-probe ==="
          curl -i --max-time 12 http://198.244.191.182:8765/api/status | head -80
          echo "=== service ==="
          sudo -n systemctl --no-pager --full status zennay-cloud.service | tail -120 || true
          echo "=== journal ==="
          sudo -n journalctl -u zennay-cloud.service -n 180 --no-pager || true
          echo "=== ufw ==="
          sudo -n ufw status verbose || true
          echo "=== nft 8765 ==="
          sudo -n nft list ruleset 2>/dev/null | grep -C 4 -E '8765|reject|drop' || true
