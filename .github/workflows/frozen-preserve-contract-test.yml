name: Frozen handoff preservation contract CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/preserve-frozen-physical-handoff.yml"
      - ".github/workflows/frozen-preserve-contract-test.yml"
      - "tests/test_preserve_frozen_handoff_workflow.py"
  pull_request:
    paths:
      - ".github/workflows/preserve-frozen-physical-handoff.yml"
      - ".github/workflows/frozen-preserve-contract-test.yml"
      - "tests/test_preserve_frozen_handoff_workflow.py"

permissions:
  contents: read

concurrency:
  group: raise-frozen-preserve-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Frozen preservation workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m unittest tests.test_preserve_frozen_handoff_workflow
      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
