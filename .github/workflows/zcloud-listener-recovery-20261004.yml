name: Recover duplicate zCloud Actions listener safely
# Operational retrigger 2026-10-05 09:18 UTC for LightUp PR13 exact-head proof 37288838154.
# Operational retrigger 2026-10-05 03:05 UTC for PWQ-24 retry acceptance 37257923671.
# Operational retrigger 2026-10-05 03:01 UTC for sole queued PWQ-24 acceptance 37257374243.
# Operational retrigger 2026-10-05 02:57 UTC for PWQ-24 exact-main acceptance 37257374243.
# Operational retrigger 2026-10-05 02:51 UTC for zCloud main 863cce00 guarded production deploy.
# Operational retrigger 2026-10-05 02:13 UTC for zCloud PWQ-24 post-447 live acceptance.
# Operational retrigger 2026-10-05 01:05 UTC for zCloud PWQ-24 queued live acceptance.
# Operational retrigger 2026-10-05 00:30 UTC for zCloud PWQ-24 queued production deploy after canary cleared.
# Operational retrigger 2026-10-04 23:46 UTC after zCloud runner stopped accepting queued audit jobs.
# Operational retrigger 2026-10-04 22:57 UTC after current-main zCloud deploy completed.
# Operational retrigger 2026-10-04 22:50 UTC for queued zCloud receipt audit/deploy.
# Operational retrigger 2026-10-04 21:34 UTC for zCloud PWQ-10; full /proc ancestry fix
# Operational retrigger 2026-10-04 22:20 UTC after zCloud runner queue went fully idle/offline; keep checkout-free.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zcloud-listener-recovery-20261004.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raiseai-zcloud-listener-recovery-20261004
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 6
    steps:
      - name: Converge zCloud runner to one canonical listener
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "${RUNNER_NAME:-}" = "vps-bb300bba"

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time

          ROOT = "/home/ubuntu/actions-runner-zcloud"
          SERVICE = "actions.runner.Zennay-zCloud.zcloud-vps-1.service"
          TEMP = pathlib.Path(ROOT) / "_work" / "_temp"

          def run(args, *, check=True):
              proc = subprocess.run(args, text=True, capture_output=True)
              if check and proc.returncode:
                  raise SystemExit(
                      f"command failed rc={proc.returncode}: {args}\n"
                      f"stdout={proc.stdout}\nstderr={proc.stderr}"
                  )
              return proc

          def service_state():
              return run(["systemctl", "is-active", SERVICE], check=False).stdout.strip()

          def control_group():
              return run(
                  ["systemctl", "show", SERVICE, "-p", "ControlGroup", "--value"],
                  check=False,
              ).stdout.strip()

          def main_pid():
              raw = run(
                  ["systemctl", "show", SERVICE, "-p", "MainPID", "--value"],
                  check=False,
              ).stdout.strip()
              return int(raw) if raw.isdigit() else 0

          def process_rows():
              out = run(["ps", "-eo", "pid=,ppid=,user=,args="]).stdout
              rows = []
              for raw in out.splitlines():
                  parts = raw.strip().split(None, 3)
                  if len(parts) < 4:
                      continue
                  pid, ppid, user, args = parts
                  pid_int = int(pid)
                  cwd = ""
                  try:
                      cwd = os.readlink(f"/proc/{pid_int}/cwd")
                  except (FileNotFoundError, PermissionError, OSError):
                      pass
                  if f"{ROOT}/bin/Runner.Worker" in args:
                      kind = "worker"
                  elif f"{ROOT}/bin/Runner.Listener" in args:
                      kind = "listener"
                  elif "runsvc.sh" in args and (ROOT in args or cwd == ROOT):
                      kind = "supervisor"
                  else:
                      continue
                  rows.append(
                      {
                          "pid": pid_int,
                          "ppid": int(ppid),
                          "user": user,
                          "cwd": cwd,
                          "args": args,
                          "kind": kind,
                      }
                  )
              return rows

          def cgroup_contains(pid, cgroup):
              if not cgroup:
                  return False
              try:
                  text = pathlib.Path(f"/proc/{pid}/cgroup").read_text()
              except (FileNotFoundError, PermissionError):
                  return False
              return cgroup in text

          def canonical_lineage_contains(pid, root_pid, rows):
              if not root_pid:
                  return False
              # Follow the kernel process tree rather than the filtered runner rows.
              # Runner.Listener is launched through intermediate service/node processes
              # that are intentionally absent from process_rows(); using only those
              # filtered rows falsely classified the canonical listener as an orphan.
              current = pid
              seen = set()
              while current and current not in seen:
                  if current == root_pid:
                      return True
                  seen.add(current)
                  try:
                      stat = pathlib.Path(f"/proc/{current}/stat").read_text()
                  except (FileNotFoundError, PermissionError, OSError):
                      return False
                  marker = stat.rfind(") ")
                  if marker < 0:
                      return False
                  fields = stat[marker + 2:].split()
                  if len(fields) < 2 or not fields[1].isdigit():
                      return False
                  current = int(fields[1])
              return False

          def still_matches(pid):
              try:
                  raw = pathlib.Path(f"/proc/{pid}/cmdline").read_bytes().replace(b"\0", b" ").decode()
                  cwd = os.readlink(f"/proc/{pid}/cwd")
              except (FileNotFoundError, PermissionError, OSError):
                  return False
              if f"{ROOT}/bin/Runner.Listener" in raw:
                  return True
              return "runsvc.sh" in raw and (ROOT in raw or cwd == ROOT)

          def snapshot(tag):
              state = service_state()
              cg = control_group()
              root_pid = main_pid()
              rows = process_rows()
              print(
                  "ZCLOUD_DUPLICATE_LISTENER_SNAPSHOT",
                  json.dumps(
                      {
                          "tag": tag,
                          "service_state": state,
                          "main_pid": root_pid,
                          "control_group": cg,
                          "processes": [
                              {
                                  **row,
                                  "canonical_cgroup": cgroup_contains(row["pid"], cg),
                                  "canonical_lineage": canonical_lineage_contains(row["pid"], root_pid, rows),
                              }
                              for row in rows
                          ],
                      },
                      sort_keys=True,
                  ),
              )
              return state, cg, root_pid, rows

          if not pathlib.Path(ROOT).is_dir():
              raise SystemExit(f"runner root missing: {ROOT}")

          state, cg, root_pid, rows = snapshot("before")
          if state == "active" and (not cg or not root_pid):
              raise SystemExit("canonical zCloud runner service is active but identity is incomplete")

          # The proven bad state has both a canonical and an orphan listener.
          # Preserve every active Runner.Worker and wait for orphan-owned work to finish.
          deadline = time.monotonic() + 180
          while True:
              state = service_state()
              cg = control_group()
              root_pid = main_pid()
              rows = process_rows()
              orphan_workers = [
                  row
                  for row in rows
                  if row["kind"] == "worker"
                  and not canonical_lineage_contains(row["pid"], root_pid, rows)
              ]
              if not orphan_workers:
                  break
              print(
                  "ZCLOUD_ORPHAN_WORKER_PRESERVED",
                  json.dumps(orphan_workers, sort_keys=True),
              )
              if time.monotonic() >= deadline:
                  raise SystemExit(
                      "orphan zCloud Runner.Worker still active after bounded wait; "
                      "no listener was terminated"
                  )
              time.sleep(5)

          state = service_state()
          cg = control_group()
          root_pid = main_pid()
          rows = process_rows()
          orphan = [
              row
              for row in rows
              if row["kind"] in {"listener", "supervisor"}
              and not canonical_lineage_contains(row["pid"], root_pid, rows)
          ]
          print("ZCLOUD_ORPHAN_LISTENER_TARGETS", json.dumps(orphan, sort_keys=True))

          for row in orphan:
              if still_matches(row["pid"]):
                  run(["sudo", "-n", "kill", "-TERM", str(row["pid"])])

          term_deadline = time.monotonic() + 15
          target_pids = {row["pid"] for row in orphan}
          while time.monotonic() < term_deadline:
              remaining = {row["pid"] for row in process_rows()} & target_pids
              if not remaining:
                  break
              time.sleep(1)

          remaining = {row["pid"] for row in process_rows()} & target_pids
          for pid in sorted(remaining):
              if still_matches(pid):
                  run(["sudo", "-n", "kill", "-KILL", str(pid)])

          # A listener can remain systemd-active while no longer accepting jobs.
          # Restart it only when there is no active Runner.Worker anywhere in the
          # zCloud runner root; active jobs are always preserved.
          rows = process_rows()
          active_workers = [row for row in rows if row["kind"] == "worker"]
          if not active_workers:
              run(["sudo", "-n", "systemctl", "restart", SERVICE])
              print("ZCLOUD_CANONICAL_LISTENER_RESTARTED_IDLE")
          elif service_state() != "active":
              raise SystemExit(
                  "zCloud runner service is inactive while Runner.Worker exists; refusing restart"
              )

          verify_deadline = time.monotonic() + 30
          while True:
              state = service_state()
              cg = control_group()
              root_pid = main_pid()
              rows = process_rows()
              listeners = [row for row in rows if row["kind"] == "listener"]
              canonical = [
                  row for row in listeners
                  if canonical_lineage_contains(row["pid"], root_pid, rows)
              ]
              orphan_runtime = [
                  row
                  for row in rows
                  if row["kind"] in {"listener", "supervisor"}
                  and not canonical_lineage_contains(row["pid"], root_pid, rows)
              ]
              if state == "active" and len(listeners) == 1 and len(canonical) == 1 and not orphan_runtime:
                  break
              if time.monotonic() >= verify_deadline:
                  snapshot("verification_failed")
                  raise SystemExit("zCloud runner did not converge to exactly one canonical listener")
              time.sleep(2)

          # Do not use a foreign sentinel in the zCloud runner temp directory here.
          # A healthy canonical runner may legitimately clean its own _work/_temp
          # between jobs. Instead require one canonical listener to remain stable
          # across a bounded observation window; the subsequent zCloud regression
          # validates runner-owned event/command files from inside a real zCloud job.
          time.sleep(12)
          state = service_state()
          cg = control_group()
          root_pid = main_pid()
          rows = process_rows()
          listeners = [row for row in rows if row["kind"] == "listener"]
          canonical = [
              row for row in listeners
              if canonical_lineage_contains(row["pid"], root_pid, rows)
          ]
          orphan_runtime = [
              row
              for row in rows
              if row["kind"] in {"listener", "supervisor"}
              and not canonical_lineage_contains(row["pid"], root_pid, rows)
          ]
          if state != "active" or len(listeners) != 1 or len(canonical) != 1 or orphan_runtime:
              snapshot("stability_failed")
              raise SystemExit("canonical zCloud listener did not remain stable for 12s")

          snapshot("after")
          print("ZCLOUD_DUPLICATE_LISTENER_RECOVERY_GREEN")
          PY

      - name: Trigger fresh zCloud regression when authenticated
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1 && gh auth status >/dev/null 2>&1; then
            gh workflow run zcloud-regression-smoke.yml -R Zennay/zCloud --ref main
            echo "ZCLOUD_REGRESSION_DISPATCHED"
          else
            echo "ZCLOUD_REGRESSION_DISPATCH_SKIPPED_NO_GH_AUTH"
          fi
