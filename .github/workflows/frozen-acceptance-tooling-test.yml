name: Frozen acceptance tooling CI

on:
  push:
    branches:
      - main
    paths:
      - "start-frozen-acceptance.command"
      - "tools/fetch-frozen-physical-handoff.py"
      - "tests/test_frozen_acceptance_launcher.py"
      - "tests/test_frozen_physical_handoff_fetcher.py"
      - ".github/workflows/frozen-acceptance-tooling-test.yml"
  pull_request:
    paths:
      - "start-frozen-acceptance.command"
      - "tools/fetch-frozen-physical-handoff.py"
      - "tests/test_frozen_acceptance_launcher.py"
      - "tests/test_frozen_physical_handoff_fetcher.py"
      - ".github/workflows/frozen-acceptance-tooling-test.yml"

permissions:
  contents: read

concurrency:
  group: raise-frozen-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Pin exact revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$revision" = "$expected"
          echo "Pinned frozen-tooling revision: $revision"

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n start-frozen-acceptance.command
          bash start-frozen-acceptance.command --help >/dev/null
          python3 -m py_compile tools/fetch-frozen-physical-handoff.py

      - name: Frozen acceptance regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_frozen_acceptance_launcher.py'
          python3 -m unittest discover -s tests -p 'test_frozen_physical_handoff_fetcher.py'
