name: Frozen acceptance tooling CI

on:
  push:
    branches:
      - main
    paths:
      - "START-HERE.md"
      - "DEVICE-TEST.md"
      - "GEMINI-HOME-SETUP.md"
      - "CHATGPT-WEB-SETUP.md"
      - "REMOTE-LOGIN.md"
      - "start-frozen-acceptance.command"
      - "tools/fetch-frozen-physical-handoff.py"
      - "tests/test_frozen_acceptance_launcher.py"
      - "tests/test_frozen_physical_handoff_fetcher.py"
      - "tests/test_frozen_acceptance_tooling_workflow.py"
      - ".github/workflows/frozen-acceptance-tooling-test.yml"
  pull_request:
    paths:
      - "START-HERE.md"
      - "DEVICE-TEST.md"
      - "GEMINI-HOME-SETUP.md"
      - "CHATGPT-WEB-SETUP.md"
      - "REMOTE-LOGIN.md"
      - "start-frozen-acceptance.command"
      - "tools/fetch-frozen-physical-handoff.py"
      - "tests/test_frozen_acceptance_launcher.py"
      - "tests/test_frozen_physical_handoff_fetcher.py"
      - "tests/test_frozen_acceptance_tooling_workflow.py"
      - ".github/workflows/frozen-acceptance-tooling-test.yml"

permissions:
  contents: read

concurrency:
  group: raise-frozen-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/raise-frozen-tooling-pyc
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Pin exact revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$revision" = "$expected"
          echo "Pinned frozen-tooling revision: $revision"

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n start-frozen-acceptance.command
          bash start-frozen-acceptance.command --help >/dev/null
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m py_compile tools/fetch-frozen-physical-handoff.py

      - name: Frozen acceptance regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_frozen_acceptance_launcher.py'
          python3 -m unittest discover -s tests -p 'test_frozen_physical_handoff_fetcher.py'
          python3 -m unittest discover -s tests -p 'test_frozen_acceptance_tooling_workflow.py'

      - name: Frozen release carrier
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp_root="$(mktemp -d)"
          trap 'rm -rf "$tmp_root"' EXIT
          output="$tmp_root/handoff"
          restore="$tmp_root/restored-source"

          python3 tools/fetch-frozen-physical-handoff.py --output "$output"
          test -f "$output/BUILD-IDENTITY.txt"
          test -f "$output/RaiseAI-v1.5.2-debug.apk"
          test -f "$output/RaiseAI-v1.5.2-source.bundle"
          test -f "$output/start-physical-handoff.command"

          RAISE_RESTORE_DIR="$restore" \
            bash "$output/start-physical-handoff.command" --verify-only

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
