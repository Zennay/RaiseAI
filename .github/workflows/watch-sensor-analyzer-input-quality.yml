name: Watch sensor analyzer input quality CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/analyze-watch-sensor-traces.py"
      - "tools/analyze-watch-sensor-trials.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - ".github/workflows/watch-sensor-analyzer-input-quality.yml"
  pull_request:
    paths:
      - "tools/analyze-watch-sensor-traces.py"
      - "tools/analyze-watch-sensor-trials.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - ".github/workflows/watch-sensor-analyzer-input-quality.yml"

permissions:
  contents: read

concurrency:
  group: watch-sensor-analyzer-input-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: [self-hosted, linux, x64, vps-bb300bba]
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pin exact head and runner
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(hostname)" = "vps-bb300bba"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Validate sensor analyzer input handling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/analyze-watch-sensor-traces.py tools/analyze-watch-sensor-trials.py
          python3 -m unittest tests.test_watch_sensor_trace_analyzer tests.test_watch_sensor_trial_analyzer -v
