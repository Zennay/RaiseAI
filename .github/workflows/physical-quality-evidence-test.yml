name: Physical quality evidence CI

on:
  push:
    branches:
      - main
    paths:
      - "physical-validation.command"
      - "PHYSICAL-ACCEPTANCE.md"
      - "tools/validate-physical-observations.py"
      - "tools/create-physical-observation-template.py"
      - "tests/test_physical_observation_validator.py"
      - "tests/test_physical_observation_template.py"
      - "tests/test_quality_workflow_action_pinning.py"
      - "tests/test_physical_quality_workflow_contract.py"
      - "tests/test_physical_quality_workflow.py"
      - ".github/workflows/watch-app-test.yml"
      - ".github/workflows/physical-quality-evidence-test.yml"
  pull_request:
    paths:
      - "physical-validation.command"
      - "PHYSICAL-ACCEPTANCE.md"
      - "tools/validate-physical-observations.py"
      - "tools/create-physical-observation-template.py"
      - "tests/test_physical_observation_validator.py"
      - "tests/test_physical_observation_template.py"
      - "tests/test_quality_workflow_action_pinning.py"
      - "tests/test_physical_quality_workflow_contract.py"
      - "tests/test_physical_quality_workflow.py"
      - ".github/workflows/watch-app-test.yml"
      - ".github/workflows/physical-quality-evidence-test.yml"

permissions:
  contents: read

concurrency:
  group: raise-physical-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/raise-physical-quality-pyc
      TZ: UTC
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/raise-physical-quality-pyc
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Pin exact revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$revision" = "$expected"
          echo "Pinned physical-quality revision: $revision"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Compile evidence tooling
        shell: bash
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/validate-physical-observations.py \
            tools/create-physical-observation-template.py

      - name: Physical quality evidence regressions
        shell: bash
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_physical_observation_validator.py'
          python3 -m unittest discover -s tests -p 'test_physical_observation_template.py'
          python3 -m unittest discover -s tests -p 'test_quality_workflow_action_pinning.py'
          python3 -m unittest tests.test_physical_quality_workflow_contract
          python3 -m unittest discover -s tests -p 'test_physical_quality_workflow.py'

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
