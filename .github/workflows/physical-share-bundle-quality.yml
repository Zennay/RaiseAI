name: Physical share bundle quality CI

on:
  pull_request:
    paths:
      - 'tools/create-physical-share-bundle.py'
      - 'tools/test-create-physical-share-bundle.py'
      - '.github/workflows/physical-share-bundle-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Python regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/test-create-physical-share-bundle.py -v
          python3 -B -m py_compile tools/create-physical-share-bundle.py tools/test-create-physical-share-bundle.py
