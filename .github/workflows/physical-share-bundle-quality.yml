name: Physical share bundle quality CI

on:
  push:
    branches:
      - main
    paths:
      - "tools/prepare-physical-share-bundle.py"
      - "tests/test_physical_share_bundle.py"
      - "tests/test_physical_share_bundle_workflow.py"
      - ".github/workflows/physical-share-bundle-quality.yml"
  pull_request:
    paths:
      - "tools/prepare-physical-share-bundle.py"
      - "tests/test_physical_share_bundle.py"
      - "tests/test_physical_share_bundle_workflow.py"
      - ".github/workflows/physical-share-bundle-quality.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: raise-physical-share-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay')
    runs-on: [self-hosted, vps-bb300bba]
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/raise-physical-share-bundle-pyc
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify pinned hosted runner and exact revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = "self-hosted"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Install pinned uv bootstrap
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Provide isolated CPython 3.12 on PATH
        shell: bash
        env:
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/raiseai-cpython-bin
        run: |
          set -euo pipefail
          uv python install 3.12.12 --default
          printf '%s\n' "$UV_PYTHON_BIN_DIR" >> "$GITHUB_PATH"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Run physical share bundle regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_physical_share_bundle

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
