name: Workflow project boundary CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "tests/test_workflow_project_boundary.py"
  pull_request:
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "tests/test_workflow_project_boundary.py"

permissions:
  contents: read

concurrency:
  group: raise-workflow-project-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Ruby/Psych runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v ruby >/dev/null
          ruby --disable-gems -e 'require "psych"; expected = ["3.2.3", "5.0.1"]; actual = [RUBY_VERSION, Psych::VERSION]; abort "unexpected Ruby/Psych runtime: #{actual.join(" / ")}" unless actual == expected; puts "Ruby #{RUBY_VERSION} / Psych #{Psych::VERSION}"'

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Enforce repository workflow project boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_workflow_project_boundary

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
