name: JavaScript surface contract CI

on:
  push:
    branches:
      - main
    paths:
      - "*.js"
      - "**/*.js"
      - "*.mjs"
      - "**/*.mjs"
      - "*.cjs"
      - "**/*.cjs"
      - "tests/javascript_surface_contract.test.mjs"
      - ".github/workflows/javascript-surface-contract.yml"
  pull_request:
    paths:
      - "*.js"
      - "**/*.js"
      - "*.mjs"
      - "**/*.mjs"
      - "*.cjs"
      - "**/*.cjs"
      - "tests/javascript_surface_contract.test.mjs"
      - ".github/workflows/javascript-surface-contract.yml"

permissions:
  contents: read

concurrency:
  group: raise-javascript-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up audited Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: "22.23.3"
          package-manager-cache: false

      - name: Verify Node runtime
        shell: bash
        run: |
          set -euo pipefail
          node -e 'if (process.version !== "v22.23.3") { throw new Error(process.version) }'

      - name: Validate tracked JavaScript surface
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/javascript_surface_contract.test.mjs

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
