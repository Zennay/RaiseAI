name: Raise quality tooling CI

on:
  push:
    branches:
      - main
    paths:
      - "*.command"
      - "*.py"
      - "*.ps1"
      - "tools/*.py"
      - "tests/test_adb_device_binding.py"
      - "tests/test_frozen_acceptance_launcher.py"
      - "tests/test_frozen_physical_handoff_fetcher.py"
      - "tests/test_physical_observation_template.py"
      - "tests/test_physical_observation_validator.py"
      - "tests/test_physical_validation_cli.py"
      - "tests/test_quality_tooling_workflow.py"
      - "tests/test_quality_workflow_action_pinning.py"
      - "tests/test_watch_apk_identity.py"
      - "tests/test_watch_e2e_evidence_validator.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - ".github/workflows/physical-quality-evidence-test.yml"
      - ".github/workflows/quality-tooling-test.yml"
      - ".github/workflows/watch-app-test.yml"
  pull_request:
    paths:
      - "*.command"
      - "*.py"
      - "*.ps1"
      - "tools/*.py"
      - "tests/test_adb_device_binding.py"
      - "tests/test_frozen_acceptance_launcher.py"
      - "tests/test_frozen_physical_handoff_fetcher.py"
      - "tests/test_physical_observation_template.py"
      - "tests/test_physical_observation_validator.py"
      - "tests/test_physical_validation_cli.py"
      - "tests/test_quality_tooling_workflow.py"
      - "tests/test_quality_workflow_action_pinning.py"
      - "tests/test_watch_apk_identity.py"
      - "tests/test_watch_e2e_evidence_validator.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - ".github/workflows/physical-quality-evidence-test.yml"
      - ".github/workflows/quality-tooling-test.yml"
      - ".github/workflows/watch-app-test.yml"

permissions:
  contents: read

concurrency:
  group: raise-quality-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/raise-quality-pyc
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n -- *.command

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile *.py tools/*.py

      - name: PowerShell syntax
        shell: bash
        run: |
          set -euo pipefail
          command -v pwsh >/dev/null
          pwsh -NoLogo -NoProfile -NonInteractive -Command '$files = @(Get-ChildItem -LiteralPath . -File -Filter "*.ps1" | Sort-Object Name); if ($files.Count -eq 0) { Write-Error "No root PowerShell entrypoints found"; exit 1 }; foreach ($file in $files) { $tokens = $null; $errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors); if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error "$($file.Name): $($_.Message)" }; exit 1 } }'

      - name: Quality tooling regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_adb_device_binding tests.test_frozen_acceptance_launcher tests.test_frozen_physical_handoff_fetcher tests.test_physical_observation_template tests.test_physical_observation_validator tests.test_physical_validation_cli tests.test_quality_tooling_workflow tests.test_quality_workflow_action_pinning tests.test_watch_apk_identity tests.test_watch_e2e_evidence_validator tests.test_watch_sensor_trace_analyzer tests.test_watch_sensor_trial_analyzer

      - name: Verify worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
