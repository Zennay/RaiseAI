name: Raise quality tooling CI

on:
  push:
    branches:
      - main
    paths:
      - "pull-diagnostics.command"
      - "pull-watch-data.command"
      - "install-watch-apk.command"
      - "provision-watch-gateway.command"
      - "physical-validation.command"
      - "start-frozen-acceptance.command"
      - "start-physical-handoff.command"
      - "tools/analyze-watch-sensor-traces.py"
      - "tools/analyze-watch-sensor-trials.py"
      - "tools/create-physical-observation-template.py"
      - "tools/fetch-frozen-physical-handoff.py"
      - "tools/validate-physical-observations.py"
      - "tools/validate-watch-e2e-evidence.py"
      - "tools/verify-watch-apk-identity.py"
      - "tests/test_adb_device_binding.py"
      - "tests/test_frozen_acceptance_launcher.py"
      - "tests/test_frozen_physical_handoff_fetcher.py"
      - "tests/test_physical_observation_template.py"
      - "tests/test_physical_observation_validator.py"
      - "tests/test_quality_tooling_workflow.py"
      - "tests/test_watch_apk_identity.py"
      - "tests/test_watch_e2e_evidence_validator.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - ".github/workflows/quality-tooling-test.yml"
  pull_request:
    paths:
      - "pull-diagnostics.command"
      - "pull-watch-data.command"
      - "install-watch-apk.command"
      - "provision-watch-gateway.command"
      - "physical-validation.command"
      - "start-frozen-acceptance.command"
      - "start-physical-handoff.command"
      - "tools/analyze-watch-sensor-traces.py"
      - "tools/analyze-watch-sensor-trials.py"
      - "tools/create-physical-observation-template.py"
      - "tools/fetch-frozen-physical-handoff.py"
      - "tools/validate-physical-observations.py"
      - "tools/validate-watch-e2e-evidence.py"
      - "tools/verify-watch-apk-identity.py"
      - "tests/test_adb_device_binding.py"
      - "tests/test_frozen_acceptance_launcher.py"
      - "tests/test_frozen_physical_handoff_fetcher.py"
      - "tests/test_physical_observation_template.py"
      - "tests/test_physical_observation_validator.py"
      - "tests/test_quality_tooling_workflow.py"
      - "tests/test_watch_apk_identity.py"
      - "tests/test_watch_e2e_evidence_validator.py"
      - "tests/test_watch_sensor_trace_analyzer.py"
      - "tests/test_watch_sensor_trial_analyzer.py"
      - ".github/workflows/quality-tooling-test.yml"

permissions:
  contents: read

concurrency:
  group: raise-quality-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact tested revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform, sys; assert platform.python_implementation() == "CPython"; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n pull-diagnostics.command pull-watch-data.command install-watch-apk.command provision-watch-gateway.command physical-validation.command start-frozen-acceptance.command start-physical-handoff.command

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/analyze-watch-sensor-traces.py tools/analyze-watch-sensor-trials.py tools/create-physical-observation-template.py tools/fetch-frozen-physical-handoff.py tools/validate-physical-observations.py tools/validate-watch-e2e-evidence.py tools/verify-watch-apk-identity.py

      - name: Quality tooling regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_adb_device_binding tests.test_frozen_acceptance_launcher tests.test_frozen_physical_handoff_fetcher tests.test_physical_observation_template tests.test_physical_observation_validator tests.test_quality_tooling_workflow tests.test_watch_apk_identity tests.test_watch_e2e_evidence_validator tests.test_watch_sensor_trace_analyzer tests.test_watch_sensor_trial_analyzer

      - name: Verify tracked worktree remains clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
